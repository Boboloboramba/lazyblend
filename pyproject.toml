[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyblend"
version = "0.1.0"
description = "A fast TUI for browsing and launching Blender blend files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "textual-dev>=1.0",
]

[project.scripts]
lazyblend = "lazyblend.app:main"

[tool.setuptools.packages.find]
where = ["src"]
